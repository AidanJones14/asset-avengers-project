@if (!hasInvestmentAccount()) {
  <div class="content account-empty-content">
    <section class="account-empty panel" aria-labelledby="empty-title">
      <div class="empty-icon" aria-hidden="true">+</div>
      <h2 id="empty-title">You have no accounts yet</h2>
      <p>Add an investment account to start using your portfolio.</p>
      <a class="button primary" routerLink="/client/accounts">Create an account</a>
    </section>
  </div>
} @else {
<app-page-frame #frame page="Overview"
  ><app-portfolio-summary
    [value]="store.value()"
    [totalReturn]="store.totalReturn()"
    [cash]="store.cash()"
    [assetCount]="store.holdings().length" />
  <div class="performance-grid">
    <app-performance-chart [value]="store.value()" [totalReturn]="store.totalReturn()" [ready]="performanceReady()" /><app-portfolio-allocation class="overview-scroll-widget" />
  </div>
  <div class="performance-grid">
  <app-holdings-table
    [assets]="store.holdings()"
    [preview]="true"
    (trade)="frame.openTrade($event)"
  />
  <app-market-watch class="overview-scroll-widget" />
  </div>
</app-page-frame>
}
