<app-page-frame #frame page="Orders"
  >@if (cancellationError()) {
    <p class="negative" role="alert">{{ cancellationError() }}</p>
  }
  <app-order-history
    [orders]="store.orders()"
    [cancellingOrderId]="cancellingOrderId()"
    (trade)="frame.openTrade()"
    (cancelOrder)="cancelOrder($event)"
/></app-page-frame>
