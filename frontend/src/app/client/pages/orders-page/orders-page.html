<app-page-frame #frame page="Orders" (dispute)="disputes.open()"
  >@if (actionError()) {
    <p class="negative" role="alert">{{ actionError() }}</p>
  }
  <app-order-history
    [orders]="store.orders()"
    [cancellingOrderId]="cancellingOrderId()"
    [updatingOrderId]="updatingOrderId()"
    (trade)="frame.openTrade()"
    (cancelOrder)="cancelOrder($event)"
    (updatePrices)="updatePrices($event)"
/>
  <app-dispute-form #disputes [accountId]="store.accountId()" [orders]="store.orders()" />
</app-page-frame>
