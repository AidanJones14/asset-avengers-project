<div class="content">
  <div class="page-heading">
    <div>
      @if (page() === 'Overview') {
        <p class="eyebrow">PERSONAL OVERVIEW</p>
      }
      <h1>{{ page() === 'Overview' ? 'Your portfolio.' : page() }}</h1>
      <p>
        {{
          page() === 'Overview'
            ? 'Welcome back. Here’s where you stand.'
            : 'Your saved trading workspace'
        }}
      </p>
    </div>
    <button class="primary" (click)="openTrade()" aria-label="New trade"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg> New trade</button>
  </div>
  @if (notice()) {
    <div class="notice success" role="status">
      {{ notice() }} <button (click)="notice.set('')" aria-label="Dismiss notification">×</button>
    </div>
  }
  <ng-content />
  <p class="disclaimer">
    USD · Endgame Trading · Account data is saved
  </p>
</div>
<app-trade-dialog
  (filled)="notice.set('Order submitted. You can track or cancel it from order history.')"
/>
