<a class="skip-link" href="#main-content">Skip to content</a>
<div class="shell" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">
  <aside (keydown.escape)="closeMobile(mobileToggle)">
    <div class="sidebar-heading">
    <a class="brand" routerLink="/client/overview" aria-label="Endgame home" (click)="closeMobile(mainContent)">
      <app-brand-logo />
    </a>
    <button class="sidebar-toggle" type="button" (click)="collapsed.set(!collapsed())"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!collapsed()" aria-controls="sidebar-navigation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /><path [attr.d]="collapsed() ? 'm13 9 3 3-3 3' : 'm17 9-3 3 3 3'" /></svg>
    </button>
    <button #mobileToggle class="mobile-toggle" type="button" (click)="mobileOpen.set(!mobileOpen())"
      [attr.aria-label]="mobileOpen() ? 'Close navigation' : 'Open navigation'"
      [attr.aria-expanded]="mobileOpen()" aria-controls="sidebar-navigation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="mobileOpen() ? 'm6 6 12 12M6 18 18 6' : 'M4 6h16M4 12h16M4 18h16'" /></svg>
    </button>
    </div>
    <p class="workspace-label">NAVIGATION</p>
    <nav id="sidebar-navigation" aria-label="Main navigation" (click)="closeMobile(mainContent)">
      <a routerLink="/client/overview" routerLinkActive="active" ariaCurrentWhenActive="page"
        aria-label="Overview" title="Overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>
        <span class="nav-label">Overview</span></a
      >
      <a routerLink="/client/portfolio" routerLinkActive="active" ariaCurrentWhenActive="page"
        aria-label="Portfolio" title="Portfolio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2" /><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v3h4v-3" /></svg>
        <span class="nav-label">Portfolio</span></a
      >
      <a routerLink="/client/orders" routerLinkActive="active" ariaCurrentWhenActive="page"
        aria-label="Orders" title="Orders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M9 8h6M9 12h6M9 16h4" /></svg>
        <span class="nav-label">Orders</span></a
      >
      <a routerLink="/client/bank-accounts" routerLinkActive="active" ariaCurrentWhenActive="page"
        aria-label="Bank Accounts" title="Bank Accounts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="12" rx="2" /><path d="M2 9h20M7 14h1M12 14h1M17 14h1" /><path d="M4 7V5h16v2" /></svg>
        <span class="nav-label">Bank Accounts</span></a
      >
      <a routerLink="/client/stock-search" routerLinkActive="active" ariaCurrentWhenActive="page"
        aria-label="Stock Search" title="Stock Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" stroke-width="2" stroke-linecap="round" /></svg>
        <span class="nav-label">Stock Search</span></a
      >
    </nav>
        <footer>
      <strong>{{ auth.fullName() }}</strong>
      <p>Client account</p>
      <button type="button" (click)="auth.logout()">Log out</button>
    </footer>
  </aside>
  <main #mainContent id="main-content" tabindex="-1" (click)="closeMobile(mobileToggle)"><router-outlet /></main>
</div>
