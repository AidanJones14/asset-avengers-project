spring.datasource.url=${order.test.jdbc-url:jdbc:h2:mem:endgame-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${order.test.jdbc-driver:org.h2.Driver}
spring.datasource.username=${order.test.jdbc-user:sa}
spring.datasource.password=${order.test.jdbc-password:}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
orders.execution.enabled=false
# H2 test schemas are created from entities, not the operational PostgreSQL DDL.
# Keep unrelated background work and JDBC quote persistence out of these tests.
admin.suspensions.enabled=false
pricing.api.persistence.enabled=false
pricing.api.base-url=http://localhost:9999
pricing.api.key=test-key
pricing.api.quotes-path=/quotes
logging.level.root=WARN
logging.level.org.hibernate.SQL=WARN

# Test-only token settings. Tests read this file instead of src/main's, so they never see .env.
# SecurityConfig needs these keys to start. HS256 needs a secret of at least 32 bytes.
jwt.shared-secret=test-secret-that-is-at-least-32-characters-long
jwt.issuer=endgame-auth
jwt.audience=endgame-api
