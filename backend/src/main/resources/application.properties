# Trading API only. Staff reporting has its own datasource/config in internal-backend.
spring.application.name=Endgame
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# DB/endgame_db.schema.sql owns constraints/triggers; Hibernate must not replace them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# The backend contacts Fauxnance; the browser only calls our public quote adapter.
pricing.api.base-url=${PRICING_API_BASE_URL}
pricing.api.key=${FAUXNANCE_PRICING_API_KEY}
pricing.api.quotes-path=${PRICING_API_QUOTES_PATH}

# Tokens from auth-server, read by security/SecurityConfig.
# The values come from the env (docker-compose, or backend/.env when run locally).
# The secret must equal auth-server's JWT_SECRET. No default: startup fails without it.
# Issuer and audience must match what auth-server stamps on tokens (its JWT_ISSUER / JWT_AUDIENCE).
jwt.shared-secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:endgame-auth}
jwt.audience=${JWT_AUDIENCE:endgame-api}

# CI readiness checks require both Spring readiness and a working database.
# Expose status only; credentials and dependency details are never returned publicly.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Maximum age of a tradable quote. Provider-marked stale quotes are always refused.
pricing.api.max-quote-age=${PRICING_MAX_QUOTE_AGE:PT2M}
