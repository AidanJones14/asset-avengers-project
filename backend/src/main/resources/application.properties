spring.application.name=Endgame
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

pricing.api.base-url=${PRICING_API_BASE_URL}
pricing.api.key=${FAUXNANCE_KEY}
pricing.api.quotes-path=${PRICING_API_QUOTES_PATH}
