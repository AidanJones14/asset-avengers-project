spring.application.name=Endgame
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

pricing.api.base-url=${PRICING_API_BASE_URL}
pricing.api.key=${FAUXNANCE_PRICING_API_KEY}
pricing.api.quotes-path=${PRICING_API_QUOTES_PATH}

# Tokens from auth-server, read by security/SecurityConfig.
# The values come from the env (docker-compose, or backend/.env when run locally).
# The secret must equal auth-server's JWT_SECRET. No default: startup fails without it.
# Issuer and audience must match what auth-server stamps on tokens (its JWT_ISSUER / JWT_AUDIENCE).
jwt.shared-secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:endgame-auth}
jwt.audience=${JWT_AUDIENCE:endgame-api}
