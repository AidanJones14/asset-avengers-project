# Standalone disposable Jenkins client/auth stack. Do not combine with development Compose.
# No fixed container/network names, published host ports, or host database directories.
# Run only through scripts/ci-compose.sh with a unique per-build project name.
services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-endgame_test}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - JWT_ISSUER=${JWT_ISSUER:-endgame-auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-endgame-api}
      - PRICING_API_BASE_URL=https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1
      - FAUXNANCE_PRICING_API_KEY=${FAUXNANCE_PRICING_API_KEY:?set FAUXNANCE_PRICING_API_KEY in .env}
      - PRICING_API_QUOTES_PATH=/quotes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading_platform_network

  auth-db:
    image: postgres:18.6-trixie
    restart: "no"
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
    volumes:
      - auth_db_data:/var/lib/postgresql
      - ../../DB/auth_db.schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../DB/auth_db_test_data.sql:/docker-entrypoint-initdb.d/02-test-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-endgame_test}\" -Atc \"SELECT 1\" >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - trading_platform_network

  auth-server:
    build:
      context: ../../auth-server
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      SUPERSET_SSO_SECRET: ${SUPERSET_SSO_SECRET:-}
      # Container side: the server listens on 3000 and reaches the DB by service name.
      AUTH_SERVICE_PORT: 3000
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-endgame-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-endgame-api}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Asset Avengers <onboarding@resend.dev>}
      EMAIL_RESET_TEMPLATE_ID: ${EMAIL_RESET_TEMPLATE_ID:-}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-12}
      # Browser development origin; CI publishes no browser-facing host port.
      CORS_ALLOWED_ORIGIN: http://localhost:8084
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - trading_platform_network

  postgres:
    image: postgres:18.6-trixie
    restart: "no"
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-endgame_test}
    volumes:
      - trading_db_data:/var/lib/postgresql
      - ../../DB/endgame_db.schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Each build starts with an empty project-owned volume and loads the SQL seed.
      - ../../DB/instruments.seed.sql:/docker-entrypoint-initdb.d/02-instruments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-endgame_test}\" -Atc \"SELECT 1\" >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - trading_platform_network

  # Admin/analyst services live in deployment/admin-analytics/admin-analyst-stack.compose.yml.

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      backend:
        condition: service_started
      auth-server:
        condition: service_healthy
    networks:
      - trading_platform_network

networks:
  trading_platform_network:
    driver: bridge

volumes:
  auth_db_data:
  trading_db_data:
