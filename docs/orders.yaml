openapi: 3.0.3
info:
  title: Order Processing Service
  description: API documentation for orders placed on our trading platform
  version: 1.0.0
paths:
  /api/orders:
    get:
      summary: Get a list of all orders
      operationId: getAllOrders
      responses:
        '200':
          description: Successfully retrieved orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order request

  /api/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get an order by ID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier of the order
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

    put:
      tags:
        - Orders
      summary: Update an existing order
      operationId: updateOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Order successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

    delete:
      tags:
        - Orders
      summary: Delete an order
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Order successfully deleted
        '404':
          description: Order not found

components:
  schemas:
    Order:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        orderType:
          type: string
          enum:
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
        orderSide:
          type: string
          enum:
            - BUY
            - SELL
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - CANCELLED
            - FILLED
        submittedAt:
          type: string
          format: date-time
    CreateOrderRequest:
      type: object
      required:
        - accountId
        - instrumentId
        - orderType
        - orderSide
        - quantity
      properties:
        orderId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        orderType:
          type: string
          enum:
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
        orderSide:
          type: string
          enum:
            - BUY
            - SELL
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
          nullable: true