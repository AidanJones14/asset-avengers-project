services:
  db:
    image: postgres:18.6-trixie
    container_name: trading_platform_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asseta26
      POSTGRES_DB: asset-avengers-client

    ports:
      - "5432:5432"

    volumes:
      - ~/.asset_postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trading_platform_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
