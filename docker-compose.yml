services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: endgame_backend
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
    depends_on:
      - postgres
    networks:
      - trading_platform_network

  postgres:
    image: postgres:15
    container_name: endgame_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=Endgame_TEST_DB
    ports:
      - "5556:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_platform_network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: trading_platform_frontend
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   environment:
  #     - NGINX_HOST=localhost
  #     - NGINX_PORT=80
  #   depends_on:
  #     - backend
  #   networks:
  #     - trading_platform_network

volumes:
  postgres_data:

networks:
  trading_platform_network:
    name: trading_platform_network
    driver: bridge
    external: true
