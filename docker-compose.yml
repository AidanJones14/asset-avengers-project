services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: endgame_backend
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
    depends_on:
      - postgres
    networks:
      - trading_platform_network

  postgres:
    image: postgres:18.6-trixie
    container_name: endgame_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5532:5432"
    volumes:
      - ~/.asset_postgres_test_data:/var/lib/postgresql
    networks:
      - trading_platform_network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: trading_platform_frontend
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   environment:
  #     - NGINX_HOST=localhost
  #     - NGINX_PORT=80
  #   depends_on:
  #     - backend
  #   networks:
  #     - trading_platform_network

networks:
  trading_platform_network:
    name: trading_platform_network
    driver: bridge
