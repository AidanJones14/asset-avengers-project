# Auth DB only; the auth server itself runs on the host (npm run dev).
# Run via `npm run db:up` so the variables below are read from ../.env.
services:
  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:?set in ../.env}
      POSTGRES_USER: ${AUTH_DB_USER:?set in ../.env}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set in ../.env}
    ports:
      - "${AUTH_DB_HOST_PORT:-5433}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-db-data:
