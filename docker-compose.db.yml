services:
  db:
    image: postgres:18.6-trixie
    container_name: trading_platform_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asseta26
      POSTGRES_DB: asset-avengers-client

    ports:
      - "5432:5432"

    volumes:
      - ~/.asset_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: trading_platform_network
    driver: bridge
