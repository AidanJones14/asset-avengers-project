server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forward staff API requests on the browser's own origin, preserving its JWT.
    location ^~ /api/v1/ {
        set $staff_api http://internal-backend:8085;
        proxy_pass $staff_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /auth/ {
        set $auth_api http://auth-server:3000;
        proxy_pass $auth_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }
    location / {
        try_files $uri $uri/ /index.html;
        # Superset checks the parent origin when serving its embedded dashboard.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }
}
